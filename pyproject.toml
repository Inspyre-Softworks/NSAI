[project]
name = 'nsai'
version = '0.2.8'
description = 'NationStates AI profile builder and live advisor.'
authors = [{ name = 'Taylor B. | Inspyre-Softworks.' }]
readme = 'README.md'
requires-python = '>=3.11,<4.0'
dependencies = [
    'nsai-secure-store',
    'openai>=2.0.0,<3.0.0',
    'requests>=2.31.0,<3.0.0',
    'duckdb>=1.1.0,<2.0.0',
    'Pillow>=10.0.0,<12.0.0',
    'rich>=14.2.0,<16.0.0',
    'textual>=0.80.0,<9.0.0',
    "winrt-windows-security-credentials-ui (>=3.2.1,<4.0.0) ; platform_system == \"Windows\"",
    "winrt-windows-foundation (>=3.2.1,<4.0.0) ; platform_system == \"Windows\"",
    "rich-argparse (>=1.7.1,<2.0.0)",
    'pydantic>=2.7.0,<3.0.0',
]

[project.scripts]
nsai = 'nsai.cli:main'
ns-profile-builder = 'nsai.profile.builder:main'
ns-live-advisor = 'nsai.advisor.live:main'

[tool.poetry]
packages = [{ include = 'nsai', from = 'src' }]

[tool.poetry.dependencies]
nsai-secure-store = { path = 'packages/nsai-secure-store', develop = true }

[tool.poetry.group.dev.dependencies]
pytest = '>=8.0.0,<9.0.0'
textual-dev = "^1.8.0"
ipython = "^9.15.0"
prompt-toolkit = "^3.0.52"
ptipython = "^1.0.1"
jupyterlab = "^4.6.2"

[build-system]
requires = ['poetry-core>=2.0.0,<3.0.0']
build-backend = 'poetry.core.masonry.api'
